# Database Configuration for LFP-AP
# MySQL Database Connection Properties

# Database URL
db.url=jdbc:mysql://localhost:3306/lfp_ap_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database Credentials
db.username=root
db.password=

# Connection Pool Settings
db.pool.initialSize=5
db.pool.maxActive=20
db.pool.maxIdle=10
db.pool.minIdle=5

# RMI Configuration
rmi.host=localhost
rmi.port=1099
rmi.service.user=UserService
rmi.service.place=PlaceService
rmi.service.report=ReportService

# Socket Server Configuration
socket.host=localhost
socket.port=8888

# Application Settings
app.name=Laptop Friendly Places
app.version=1.0.0
app.session.timeout=3600
